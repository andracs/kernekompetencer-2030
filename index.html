<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Skills 2030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F7; --card:#FFFFFF; --ink:#000000; --muted:#5C5C5C; --line:#E2E2E4;
  --accent:#000000; --accent-ink:#FFF387; --accent-soft:#FFF387; --accent-soft-ink:#000000; --chip:#F6F6F7; --warn-soft:#F0F0F1; --warn-ink:#3A3A3A;
  --hl-bg:#FFF387; --hl-ink:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#111111; --ink:#FFFFFF; --muted:#A3A3A3; --line:#2A2A2A;
    --accent:#FFF387; --accent-ink:#000000; --accent-soft:#2E2C12; --accent-soft-ink:#FFF387; --chip:#1A1A1A; --warn-soft:#222222; --warn-ink:#D9D9D9;
    --hl-bg:transparent; --hl-ink:#FFF387;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#111111; --ink:#FFFFFF; --muted:#A3A3A3; --line:#2A2A2A;
  --accent:#FFF387; --accent-ink:#000000; --accent-soft:#2E2C12; --accent-soft-ink:#FFF387; --chip:#1A1A1A; --warn-soft:#222222; --warn-ink:#D9D9D9;
  --hl-bg:transparent; --hl-ink:#FFF387;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:32px 16px 48px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(30px,5.4vw,52px);line-height:1.05;letter-spacing:-.025em;margin:0 0 14px;font-weight:700}
h1 span{background:var(--hl-bg);color:var(--hl-ink);padding:0 .14em;margin-left:-.14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.lead{max-width:760px;color:var(--muted);font-size:16px;margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.group{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.modes button{padding:7px 14px;font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;padding:16px;border-bottom:1px solid var(--line)}
.steps button{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;text-align:left;border-radius:14px;padding:12px 14px;white-space:normal;line-height:1.3;height:100%}
.steps button .n{font-family:"Space Grotesk",Inter,sans-serif;font-size:12px;font-weight:700;width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.steps button .t{font-size:13.5px;font-weight:700}
.steps button .s{font-size:12px;font-weight:500;color:var(--muted)}
.steps button[aria-pressed="true"] .s{color:inherit;opacity:.8}
.steps button[aria-pressed="true"] .n{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.steps button:not(:last-child)::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;font-weight:600;pointer-events:none}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr;gap:10px}.steps button::after{display:none}}
.modelead{margin:0;padding:14px 16px 0;font-size:14.5px;color:var(--ink);max-width:880px}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px 4px}
.legend button{font-weight:500;background:transparent}
.legend button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.markers{display:flex;flex-wrap:wrap;gap:16px;padding:6px 16px 0;font-size:12.5px;color:var(--muted)}
.markers span{display:inline-flex;align-items:center;gap:6px}
.markers svg{flex:none}
.hint{font-size:12.5px;color:var(--muted);padding:4px 16px 0;margin:0}
.chart{position:relative;overflow-x:auto;padding:4px 8px 8px;-webkit-overflow-scrolling:touch}
.chart svg{display:block;width:100%;min-width:720px;height:auto;touch-action:manipulation}
.chart .pt{cursor:pointer}
.chart .pt .mk{transition:stroke-width .12s}
.chart .pt:hover .mk,.chart .pt.on .mk{stroke-width:4}
.chart .own{cursor:grab}
.chart .own.drag{cursor:grabbing}
.chart.placing svg{cursor:crosshair}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;min-width:200px;max-width:270px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
.tip.show{opacity:1;transform:none}
.tip b{display:block;font-size:14px;margin-bottom:4px;line-height:1.3}
.tip .cat{display:flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:8px}
.tip .row{display:flex;justify-content:space-between;gap:12px}
.tip .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.tip .q{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.detail{margin:0 16px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--chip);font-size:13.5px}
.detail h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.detail p{margin:6px 0}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.tag.new{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.tag.move{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.srcs a{font-size:12px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;text-decoration:none}
.srcs a:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.pad{padding:18px 20px}
h2{font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;margin:0 0 12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);padding:6px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .dot{margin-right:6px;vertical-align:-1px}
.qtag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.qtag.core{background:var(--accent-soft);color:var(--accent-soft-ink)}
.scroll{max-height:560px;overflow:auto}
.item{padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.item:last-child{border-bottom:0}
.item h4{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.item p{margin:4px 0;color:var(--ink)}
.item.sel h4{background:var(--accent-soft);color:var(--accent-soft-ink);margin-left:-6px;padding:2px 6px;border-radius:6px}
.blind{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.blind ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
.blind li{margin-bottom:4px}
.src p{margin:0 0 10px;font-size:13.5px}
.src .cite{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0;word-break:break-word}
.src a{color:var(--ink);text-decoration-color:var(--muted);text-underline-offset:2px}
.src a:hover{background:var(--hl-bg);color:var(--hl-ink)}
.src small,.note{color:var(--muted);font-size:12.5px;display:block;line-height:1.55}
.src h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.src ul{margin:0;padding-left:18px;font-size:13px}
.src li{margin-bottom:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:14px}
form .full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.rangeRow{display:flex;gap:8px;align-items:center}
.rangeRow input[type=range]{flex:1;padding:0;border:0;accent-color:var(--accent)}
.rangeRow input[type=number]{width:72px}
.ownrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ownrow:last-child{border-bottom:0}
.ownrow .meta{flex:1;min-width:0}
.ownrow .meta b{display:block}
.ownrow .meta span{color:var(--muted);font-size:12.5px}
.ownrow .btns{display:flex;gap:4px}
.ownrow .btns button{padding:4px 10px;font-size:12px}
.banner{font-size:12.5px;background:var(--warn-soft);color:var(--warn-ink);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>

  <div class="card">
    <nav class="steps" id="modes" aria-label="Trin">
      <button data-mode="wef"></button>
      <button data-mode="dkeu"></button>
      <button data-mode="vid"></button>
      <button data-mode="own"></button>
    </nav>
    <p class="modelead" id="modeLead"></p>
    <div class="toolbar" style="border-bottom:0;padding-bottom:0">
      <div class="group">
        <button id="btnLabels" aria-pressed="true"></button>
        <button id="btnBgWef" aria-pressed="false"></button>
        <button id="btnBgDk" aria-pressed="false"></button>
        <button id="btnBgVid" aria-pressed="false"></button>
        <button id="btnReset"></button>
      </div>
      <div class="group">
        <div class="seg" role="group" aria-label="Sprog / Language">
          <button data-lang="da">DA</button>
          <button data-lang="en">EN</button>
        </div>
        <button id="btnTheme" aria-label="Tema">◐</button>
        <button id="btnPng"></button>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="markers" id="markers"></div>
    <p class="hint" id="hint"></p>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    <div class="detail" id="detail" hidden></div>
  </div>

  <div class="grid2">
    <div class="card pad" id="left"></div>
    <div class="card pad src" id="source"></div>
  </div>
</div>

<script>
/* ---------- Kilder ---------- */
const WEF_URL = "https://www.weforum.org/publications/the-future-of-jobs-report-2025/in-full/3-skills-outlook/";
const EXPLORER_URL = "https://www.weforum.org/publications/the-future-of-jobs-report-2025/data-explorer/";
const SRC = {
  wef:     {g:"glob", t:"WEF, The Future of Jobs Report 2025 (2025)", u:WEF_URL},
  digcomp: {g:"eu",   t:"JRC, DigComp 3.0 (2025)", u:"https://joint-research-centre.ec.europa.eu/jrc-news-and-updates/european-commission-updates-its-digital-competence-framework-digcomp-2025-11-27_en"},
  aiact:   {g:"eu",   t:"AI Act, artikel 4 (2024/1689)", u:"https://artificialintelligenceact.eu/da/article/4/"},
  omnibus: {g:"eu",   t:"Digital Omnibus on AI (2026)", u:"https://www.cuatrecasas.com/en/spain/intellectual-property/art/digital-omnibus-ai-has-been-published"},
  union:   {g:"eu",   t:"Europa-Kommissionen, Union of Skills (2025)", u:"https://employment-social-affairs.ec.europa.eu/news/union-skills-strategy-equip-people-competitive-europe-2025-03-05_en"},
  cedefop: {g:"eu",   t:"Cedefop, AI skills survey (2025)", u:"https://digital-skills-jobs.europa.eu/en/inspiration/research/skills-empower-workers-ai-revolution-first-findings-cedefops-ai-skills-survey"},
  eurobaro:{g:"eu",   t:"Eurobarometer om cyberkompetencer (2024)", u:"https://digital-skills-jobs.europa.eu/en/latest/news/eu-faces-growing-cybersecurity-skills-gap-new-eurobarometer-reveals"},
  enisa:   {g:"eu",   t:"ENISA, State of Cybersecurity in the Union (2024)", u:"https://enisa.europa.eu/news/eus-first-ever-report-on-the-state-of-cybersecurity-in-the-union"},
  greencomp:{g:"eu",  t:"JRC, GreenComp (2022)", u:"https://joint-research-centre.ec.europa.eu/greencomp-european-sustainability-competence-framework_en"},
  dd:      {g:"eu",   t:"EU, Digital Decade Country Report Danmark (2025)", u:"https://digital-strategy.ec.europa.eu/en/factpages/denmark-2025-digital-decade-country-report"},
  digst:   {g:"dk",   t:"Digitaliseringsstyrelsen, Vejledning om AI-færdigheder", u:"https://digst.dk/media/dlhcbfk0/vejledning-i-ai-faerdigheder.pdf"},
  dst:     {g:"dk",   t:"Danmarks Statistik, virksomhedernes brug af AI (2025)", u:"https://www.dst.dk/da/Statistik/udgivelser/NytHtml?cid=55352"},
  de:      {g:"dk",   t:"Dansk Erhverv, AI i danske virksomheder 2025 (2026)", u:"https://www.danskerhverv.dk/politik-og-analyser/analyser/2026/februar/danske-virksomheders-brug--af-kunstig-intelligens-ai-i-2025/"},
  lederne: {g:"dk",   t:"Lederne, AI-kompetencer (2024)", u:"https://www.lederne.dk/-/media/files/analyser/det-er-afgoerende-med-bedre-ai-kompetencer.pdf"},
  pwc:     {g:"dk",   t:"PwC, AI Jobs Barometer Danmark (2026)", u:"https://www.pwc.dk/da/publikationer/2026/ai-gaar-fra-niche-til-bredere-anvendelse-i-det-danske-arbejdsmarked.html"},
  cefau:   {g:"dk",   t:"Aarhus Universitet, CEFAU research brief (2025)", u:"https://econ.au.dk/fileadmin/ECON/Subsites/CEFAU/Research_Brief_AI_og_effekten_p%C3%A5_jobs_kompetencekrav_og_l%C3%B8n.pdf"},
  klima:   {g:"dk",   t:"HBS Economics for Klimarådet (2024)", u:"https://klimaraadet.dk/sites/default/files/node/field_files/Review%20af%20studier%20relateret%20til%20arbejdsmarkedet%20og%20den%20gr%C3%B8nne%20omstilling.pdf"},
  kbu:     {g:"nord", t:"Kompetansebehovsutvalget, Norge (2025)", u:"https://www.kompetansebehovsutvalget.no/uploads/ryOX1yAG/Kompetansebehovsutvalget_rapport_digitalversjon.pdf"},
  airad:   {g:"nord", t:"Arbetsmarknadens AI-råd, Sverige (2025)", u:"https://www.almega.se/app/uploads/2025/11/Arbetsmarknadens-AI-rad-%E2%80%93-Insiktsrapport-1-1.pdf"},
  norden:  {g:"nord", t:"Nordisk Ministerråd, Future Skills", u:"https://www.norden.org/en/future-skills"}
};

/* ---------- Kategorier (fast rækkefølge, valideret palet) ---------- */
const CATS = {
  cog:{en:"Cognitive skills",    da:"Kognitive færdigheder", l:"#2a78d6", d:"#3987e5"},
  sef:{en:"Self-efficacy",       da:"Mestringstro",          l:"#eb6834", d:"#d95926"},
  eng:{en:"Engagement skills",   da:"Engagement",            l:"#1baf7a", d:"#199e70"},
  mgt:{en:"Management skills",   da:"Ledelse og styring",    l:"#eda100", d:"#c98500"},
  wwo:{en:"Working with others", da:"Samarbejde",            l:"#e87ba4", d:"#d55181"},
  phy:{en:"Physical abilities",  da:"Fysiske evner",         l:"#008300", d:"#008300"},
  tec:{en:"Technology skills",   da:"Teknologi",             l:"#4a3aa7", d:"#9085e9"},
  eth:{en:"Ethics",              da:"Etik",                  l:"#e34948", d:"#e66767"}
};
const OWN_CAT = {en:"Own / uncategorised", da:"Egen / ukategoriseret", l:"#5C5C5C", d:"#A3A3A3"};
const catOf = c => CATS[c] || OWN_CAT;

/* ---------- WEF-data (aflæst fra figur 3.6, afrundet) ---------- */
const DATA = [
  {id:"ai",   en:["AI and big data"], da:["AI og big data"], x:47,y:87,c:"tec",p:"r"},
  {id:"tl",   en:["Technological","literacy"], da:["Teknologisk","forståelse"], x:51,y:76,c:"tec",p:"t"},
  {id:"ct",   en:["Creative","thinking"], da:["Kreativ","tænkning"], x:58,y:74,c:"cog",p:"b"},
  {id:"cur",  en:["Curiosity and","lifelong learning"], da:["Nysgerrighed","og livslang","læring"], x:50,y:69,c:"sef",p:"l"},
  {id:"res",  en:["Resilience, flexibility","and agility"], da:["Robusthed,","fleksibilitet og","omstillingsevne"], x:67,y:69,c:"sef",p:"r"},
  {id:"lead", en:["Leadership and","social influence"], da:["Ledelse og social","indflydelse"], x:60,y:65,c:"wwo",p:"b"},
  {id:"tal",  en:["Talent","management"], da:["Talent-","udvikling"], x:47,y:62,c:"mgt",p:"l"},
  {id:"an",   en:["Analytical","thinking"], da:["Analytisk","tænkning"], x:70,y:61,c:"cog",p:"r"},
  {id:"sys",  en:["Systems","thinking"], da:["System-","tænkning"], x:44,y:58,c:"cog",p:"b"},
  {id:"mot",  en:["Motivation and","self-awareness"], da:["Motivation og","selvindsigt"], x:54,y:53,c:"sef",p:"r"},
  {id:"emp",  en:["Empathy and","active listening"], da:["Empati og","aktiv lytning"], x:50,y:51,c:"wwo",p:"r",dy:24},
  {id:"svc",  en:["Service orientation and","customer service"], da:["Serviceorientering og","kundeservice"], x:48,y:44,c:"eng",p:"b"},
  {id:"rm",   en:["Resource management","and operations"], da:["Ressourcestyring","og drift"], x:43,y:32,c:"mgt",p:"r"},
  {id:"dep",  en:["Dependability and","attention to detail"], da:["Pålidelighed og sans","for detaljer"], x:39,y:24,c:"sef",p:"r"},
  {id:"qc",   en:["Quality","control"], da:["Kvalitets-","kontrol"], x:33,y:29,c:"mgt",p:"t"},
  {id:"tm",   en:["Teaching and","mentoring"], da:["Undervisning","og mentoring"], x:28,y:39,c:"wwo",p:"r"},
  {id:"prog", en:["Programming"], da:["Programmering"], x:12,y:39,c:"tec",p:"l"},
  {id:"mm",   en:["Marketing","and media"], da:["Marketing","og medier"], x:17,y:35,c:"eng",p:"t"},
  {id:"ml",   en:["Multi-lingualism"], da:["Flersprogethed"], x:19,y:32,c:"cog",p:"r"},
  {id:"gc",   en:["Global","citizenship"], da:["Globalt","medborgerskab"], x:6.5,y:29,c:"eth",p:"t"},

const THEMES = {
  light:{card:"#FFFFFF",ink:"#000000",muted:"#5C5C5C",grid:"#E6E6E8",div:"#000000",qCore:"#FFF9C4",qEm:"#F6F6F7",qSt:"#F6F6F7",qOut:"#FBFBFB",coreTitle:"#000000",stroke:"#FFFFFF",arrow:"#8C8C8C",hl:"#FFF387"},
  dark:{card:"#111111",ink:"#FFFFFF",muted:"#A3A3A3",grid:"#262626",div:"#D9D9D9",qCore:"#24220F",qEm:"#171717",qSt:"#171717",qOut:"#131313",coreTitle:"#FFF387",stroke:"#111111",arrow:"#7A7A7A",hl:"#FFF387"}
};

/* ---------- Tilstand og lagring ---------- */
const LS = "coreskills2030:v1";
let storageOK = true;
function load(){ try{ const raw = localStorage.getItem(LS); return raw ? JSON.parse(raw) : {}; }catch(_){ storageOK=false; return {}; } }
function persist(){ try{ localStorage.setItem(LS, JSON.stringify({mode:state.mode, lang:state.lang, own:state.own})); storageOK=true; }catch(_){ storageOK=false; } }
const saved = load();
const state = {
  mode: "vid",
  lang: saved.lang==="en" ? "en" : "da",
  own: Array.isArray(saved.own) ? saved.own.filter(validOwn) : [],
  labels:true, bgWef:false, bgDk:false, bgVid:false, focus:null, sort:{k:"y",dir:-1}, pinned:null, sel:null, editing:null
};
function validOwn(o){ return o && typeof o.name==="string" && o.name.trim() && isFinite(o.x) && isFinite(o.y); }

const root = document.documentElement;
const mq = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme==="dark" : mq.matches;
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const T_ = () => T[state.lang];

/* ---------- Geometri ---------- */
const X0=90, X1=960, Y0=40, Y1=640, XMAX=80, YMAX=100;
const px = x => X0 + x*(X1-X0)/XMAX;
const py = y => Y1 - y*(Y1-Y0)/YMAX;
const ux = sx => Math.max(0, Math.min(XMAX, (sx-X0)*XMAX/(X1-X0)));
const uy = sy => Math.max(0, Math.min(YMAX, (Y1-sy)*YMAX/(Y1-Y0)));
const quad = d => d.x>=40 ? (d.y>=50?"core":"steady") : (d.y>=50?"emerging":"outfocus");
const color = (c, dark) => catOf(c)[dark?"d":"l"];
const matches = d => !state.focus || (state.focus.t==="cat" ? d.c===state.focus.v : quad(d)===state.focus.v);
const nameOf = (d, lang) => d.name ? (typeof d.name==="string" ? d.name : d.name[lang]) : d[lang].join(" ").replace(/-\s/g,"");
const layered = () => state.mode==="vid" || state.mode==="own";
const showDkeu = () => state.mode!=="wef";
const dkDim = () => layered() && !state.bgDk;
const showVid = () => layered();
const vidDim = () => state.mode==="own" && !state.bgVid;

function labelPos(cx, cy, p, n, dx, dy){
  let lx, ly, a;
  if(p==="r"){lx=cx+14; ly=cy+4-(n-1)*7; a="start";}
  else if(p==="l"){lx=cx-14; ly=cy+4-(n-1)*7; a="end";}
  else if(p==="t"){lx=cx; ly=cy-15-(n-1)*14; a="middle";}
  else {lx=cx; ly=cy+25; a="middle";}
  return {lx:lx+(dx||0), ly:ly+(dy||0), a};
}
function textBlock(lines, lx, ly, a, th, weight){
  let s = `<text x="${lx}" y="${ly}" font-size="12.5" font-weight="${weight||500}" fill="${th.ink}" text-anchor="${a}" paint-order="stroke" stroke="${th.halo}" stroke-width="3" stroke-linejoin="round">`;
  lines.forEach((l,i)=> s += `<tspan x="${lx}" dy="${i?14:0}">${esc(l)}</tspan>`);
  return s + `</text>`;
}
function hexagon(cx, cy, r){ let d=""; for(let i=0;i<6;i++){ const a=Math.PI/3*i - Math.PI/2; d += (i?"L":"M")+(cx+r*Math.cos(a)).toFixed(1)+" "+(cy+r*Math.sin(a)).toFixed(1)+" "; } return d+"Z"; }
function diamond(cx, cy, r){ return `M${cx} ${cy-r} L${cx+r} ${cy} L${cx} ${cy+r} L${cx-r} ${cy} Z`; }
function wrapName(name){
  const words = String(name).split(/\s+/); const lines=[]; let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length>20 && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); });
  if(cur) lines.push(cur);
  return lines.slice(0,3);
}

/* ---------- Figur ---------- */
function chartMarkup(thBase, dark, lang, opts){
  const th = Object.assign({halo: thBase.card}, thBase);
  const t = T[lang], mode = state.mode; let s = "";
  const mx = px(40), my = py(50);
  const qs = [
    {k:"emerging",x:X0,y:Y0,w:mx-X0,h:my-Y0,f:th.qEm,tx:(X0+mx)/2,ty:Y0+32},
    {k:"core",x:mx,y:Y0,w:X1-mx,h:my-Y0,f:th.qCore,tx:(mx+X1)/2,ty:Y0+32},
    {k:"outfocus",x:X0,y:my,w:mx-X0,h:Y1-my,f:th.qOut,tx:(X0+mx)/2,ty:Y1-42},
    {k:"steady",x:mx,y:my,w:X1-mx,h:Y1-my,f:th.qSt,tx:(mx+X1)/2,ty:Y1-42}
  ];
  s += `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="${th.arrow}"/></marker></defs>`;
  qs.forEach(q=>{
    const dim = state.focus && state.focus.t==="q" && state.focus.v!==q.k;
    s += `<rect data-q="${q.k}" class="qbg" x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" fill="${q.f}" opacity="${dim?0.45:1}"/>`;
  });
  for(let v=10; v<XMAX; v+=10){ if(v!==40) s+=`<line x1="${px(v)}" y1="${Y0}" x2="${px(v)}" y2="${Y1}" stroke="${th.grid}" stroke-dasharray="3 4" pointer-events="none"/>`; }
  for(let v=10; v<YMAX; v+=10){ if(v!==50) s+=`<line x1="${X0}" y1="${py(v)}" x2="${X1}" y2="${py(v)}" stroke="${th.grid}" stroke-dasharray="3 4" pointer-events="none"/>`; }
  s += `<g pointer-events="none"><line x1="${mx}" y1="${Y0}" x2="${mx}" y2="${Y1}" stroke="${th.div}" stroke-width="1.6"/>`;
  s += `<line x1="${X0}" y1="${my}" x2="${X1}" y2="${my}" stroke="${th.div}" stroke-width="1.6"/>`;
  s += `<rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}" fill="none" stroke="${th.div}" stroke-width="1.6"/>`;
  for(let v=0; v<=XMAX; v+=10) s+=`<text x="${px(v)}" y="${Y1+22}" font-size="12" fill="${th.muted}" text-anchor="middle">${v}</text>`;
  for(let v=0; v<=YMAX; v+=10) s+=`<text x="${X0-12}" y="${py(v)+4}" font-size="12" fill="${th.muted}" text-anchor="end">${v}</text>`;
  s += `<text x="${(X0+X1)/2}" y="${Y1+52}" font-size="13.5" font-weight="600" fill="${th.ink}" text-anchor="middle">${esc(t.x)}</text>`;
  s += `<text transform="translate(30 ${(Y0+Y1)/2}) rotate(-90)" font-size="13.5" font-weight="600" fill="${th.ink}" text-anchor="middle">${esc(t.y)}</text></g>`;
  qs.forEach(q=>{
    const [h,sub] = t.q[q.k];
    const c = q.k==="core" ? th.coreTitle : th.ink;
    s += `<g data-q="${q.k}" class="qtitle"><text x="${q.tx}" y="${q.ty}" font-family="Space Grotesk, Inter, sans-serif" font-size="18" font-weight="700" fill="${c}" text-anchor="middle">${esc(h)}</text>`;
    s += `<text x="${q.tx}" y="${q.ty+19}" font-size="12.5" fill="${th.muted}" text-anchor="middle">${esc(sub)}</text></g>`;
  });

  const wefFull = mode==="wef" || (layered() && state.bgWef);
  const dkd = dkDim();
  const dk = showDkeu();

  /* Pile for flyttede (under punkterne) */
  if(dk){
    DKEU.filter(d=>d.kind==="move").forEach(d=>{
      const o = DATA.find(w=>w.id===d.ref); const op = (matches(d)?1:0.15) * (dkd?0.35:1);
      const x1=px(o.x), y1=py(o.y), x2=px(d.x), y2=py(d.y), L=Math.hypot(x2-x1,y2-y1);
      const k1 = 9/L, k2 = (L-13)/L;
      s += `<line x1="${x1+(x2-x1)*k1}" y1="${y1+(y2-y1)*k1}" x2="${x1+(x2-x1)*k2}" y2="${y1+(y2-y1)*k2}" stroke="${th.arrow}" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)" opacity="${op}" pointer-events="none"/>`;
    });
  }

  /* WEF-punkter */
  DATA.forEach(d=>{
    const cx=px(d.x), cy=py(d.y);
    const dimmed = !wefFull;
    const op = matches(d) ? (dimmed ? (MOVED.has(d.id)&&dk ? 0.5 : 0.32) : 1) : 0.12;
    const r = dimmed ? 5.5 : 8.5;
    s += `<g class="pt${state.pinned==="w:"+d.id?" on":""}" data-k="w:${d.id}" opacity="${op}">`;
    s += `<circle cx="${cx}" cy="${cy}" r="${dimmed?11:14}" fill="transparent"/>`;
    s += `<circle class="mk" cx="${cx}" cy="${cy}" r="${r}" fill="${color(d.c,dark)}" stroke="${th.stroke}" stroke-width="2"/>`;
    if(wefFull && state.labels){ const L = labelPos(cx,cy,d.p,d[lang].length,d.dx,d.dy); s += textBlock(d[lang], L.lx, L.ly, L.a, th); }
    s += `</g>`;
  });

  /* DK/EU-punkter */
  if(dk){
    DKEU.forEach(d=>{
      const cx=px(d.x), cy=py(d.y), op = (matches(d)?1:0.15) * (dkd?0.4:1), col=color(d.c,dark);
      s += `<g class="pt${state.pinned==="d:"+d.id||state.sel==="d:"+d.id?" on":""}" data-k="d:${d.id}" opacity="${op}">`;
      s += `<circle cx="${cx}" cy="${cy}" r="15" fill="transparent"/>`;
      if(d.kind==="new") s += `<path class="mk" d="${diamond(cx,cy,dkd?7.5:10.5)}" fill="${col}" stroke="${th.stroke}" stroke-width="2" stroke-linejoin="round"/>`;
      else s += `<circle class="mk" cx="${cx}" cy="${cy}" r="${dkd?5.5:8}" fill="${th.card}" stroke="${col}" stroke-width="${dkd?2.5:3.5}"/>`;
      if(!dkd && (state.labels || state.mode==="dkeu")){ const L = labelPos(cx,cy,d.p,d[lang].length,d.dx,d.dy); s += textBlock(d[lang], L.lx, L.ly, L.a, th, 600); }
      s += `</g>`;
    });
  }

  /* Videndag-punkter */
  if(showVid()){
    const vd = vidDim();
    VIDENDAG.forEach(v=>{
      const cx=px(v.x), cy=py(v.y), op = (matches(v)?1:0.15) * (vd?0.45:1), lines=wrapName(v.name);
      s += `<g class="pt${state.sel==="v:"+v.id?" on":""}" data-k="v:${v.id}" opacity="${op}">`;
      s += `<circle cx="${cx}" cy="${cy}" r="15" fill="transparent"/>`;
      s += `<path class="mk" d="${hexagon(cx,cy,vd?7:10.5)}" fill="${th.hl}" stroke="${dark?"#FFF387":"#000000"}" stroke-width="${vd?1.2:1.8}" stroke-linejoin="round"/>`;
      if(!vd && state.labels){ const L = labelPos(cx,cy, v.x<62?"r":"l", lines.length); s += textBlock(lines, L.lx, L.ly, L.a, th, 600); }
      s += `</g>`;
    });
  }

  /* Egne punkter */
  if(mode==="own"){
    state.own.forEach(o=>{
      const cx=px(o.x), cy=py(o.y), op = matches(o)?1:0.15, col=color(o.c,dark), lines=wrapName(o.name);
      const rightSide = o.x < 62;
      const L = labelPos(cx,cy, rightSide?"r":"l", lines.length);
      s += `<g class="pt own${state.sel==="o:"+o.id?" on":""}" data-k="o:${o.id}" opacity="${op}">`;
      s += `<circle cx="${cx}" cy="${cy}" r="16" fill="transparent"/>`;
      s += `<rect class="mk" x="${cx-8.5}" y="${cy-8.5}" width="17" height="17" rx="4" fill="${col}" stroke="${th.stroke}" stroke-width="2"/>`;
      s += textBlock(lines, L.lx, L.ly, L.a, th, 600);
      s += `</g>`;
    });
  }
  return s;
}

function renderChart(){
  const dark = isDark(), th = THEMES[dark?"dark":"light"];
  const el = document.getElementById("chart");
  const old = el.querySelector("svg"); if(old) old.remove();
  el.classList.toggle("placing", state.mode==="own");
  el.insertAdjacentHTML("beforeend",
    `<svg viewBox="0 0 1000 715" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(T_().titlePlain)}" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">${chartMarkup(th,dark,state.lang)}</svg>`);
}

/* ---------- Forklaringer ---------- */
function markerSvg(kind, col, card){
  if(kind==="w") return `<svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="${col}"/></svg>`;
  if(kind==="wd") return `<svg width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="${col}" opacity=".35"/></svg>`;
  if(kind==="n") return `<svg width="16" height="16"><path d="${diamond(8,8,7)}" fill="${col}"/></svg>`;
  if(kind==="v") return `<svg width="16" height="16"><path d="${hexagon(8,8,7)}" fill="#FFF387" stroke="#000" stroke-width="1.3"/></svg>`;
  if(kind==="m") return `<svg width="16" height="16"><circle cx="8" cy="8" r="5.5" fill="${card}" stroke="${col}" stroke-width="2.5"/></svg>`;
  return `<svg width="16" height="16"><rect x="2" y="2" width="12" height="12" rx="3" fill="${col}"/></svg>`;
}
function renderLegend(){
  const dark = isDark(), t=T_(), lg = document.getElementById("legend");
  let html = Object.entries(CATS).map(([k,c])=>{
    const on = state.focus && state.focus.t==="cat" && state.focus.v===k;
    return `<button data-cat="${k}" aria-pressed="${!!on}"><span class="dot" style="background:${dark?c.d:c.l}"></span>${esc(c[state.lang])}</button>`;
  }).join("");
  lg.innerHTML = html;
  const mk = document.getElementById("markers"), ink = dark?"#A3A3A3":"#5C5C5C", card = dark?"#111111":"#FFFFFF";
  if(state.mode==="wef"){ mk.innerHTML=""; mk.hidden=true; return; }
  mk.hidden=false;
  const wefOn = layered() && state.bgWef, dim = dkDim() ? (state.lang==="da"?", nedtonet":", dimmed") : "";
  let m = `<span>${markerSvg(wefOn?"w":"wd",ink,card)}${esc(wefOn?t.mk.wef:t.mk.wefDim)}</span>`;
  if(showDkeu()) m += `<span>${markerSvg("n",ink,card)}${esc(t.mk.nw.replace(")", dim+")"))}</span><span>${markerSvg("m",ink,card)}${esc(t.mk.mv.replace(")", dim+")"))}</span>`;
  if(showVid()) m += `<span>${markerSvg("v",ink,card)}${esc(t.mk.vid)}${vidDim()?(state.lang==="da"?" (nedtonet)":" (dimmed)"):""}</span>`;
  if(state.mode==="own") m += `<span>${markerSvg("o",ink,card)}${esc(t.mk.own)}</span>`;
  mk.innerHTML = m;
}

/* ---------- Venstre panel ---------- */
function srcLinks(keys){ return `<div class="srcs">${keys.map(k=>`<a href="${SRC[k].u}" target="_blank" rel="noopener">${esc(SRC[k].t)}</a>`).join("")}</div>`; }
function dkeuDetailHTML(d){
  const t=T_(), lang=state.lang, dark=isDark();
  let pos;
  if(d.kind==="move"){ const o=DATA.find(w=>w.id===d.ref); pos = `${t.tagMove} ${t.from} ${o.x}/${o.y} ${t.to} ${d.x}/${d.y} (${t.est})`; }
  else pos = `${t.tt2025} ${d.x} %, ${t.tt2030.toLowerCase()} ${d.y} % (${t.est})`;
  return `<h3><span class="dot" style="background:${color(d.c,dark)}"></span>${esc(nameOf(d,lang))} <span class="tag ${d.kind==="new"?"new":"move"}">${d.kind==="new"?t.tagNew:t.tagMove}</span></h3>
    <p class="note">${esc(pos)}</p><p>${esc(d.why[lang])}</p>${srcLinks(d.src)}`;
}

function renderLeft(){
  const t=T_(), el=document.getElementById("left");
  if(state.mode==="wef") return renderTable(el);
  if(state.mode==="dkeu"){
    const dark=isDark();
    let h = `<h2>${t.dkeuTitle}</h2><div class="scroll">`;
    DKEU.forEach(d=>{
      h += `<div class="item${state.sel==="d:"+d.id?" sel":""}" data-item="${d.id}"><h4 data-pick="${d.id}">${markerSvg(d.kind==="new"?"n":"m", color(d.c,dark), dark?"#111111":"#FFFFFF")}${esc(nameOf(d,state.lang))} <span class="tag ${d.kind==="new"?"new":"move"}">${d.kind==="new"?t.tagNew:t.tagMove}</span></h4>
        <p>${esc(d.why[state.lang])}</p>${srcLinks(d.src)}</div>`;
    });
    h += `</div><div class="blind"><h2>${t.blindTitle}</h2><ul>${t.blind.map(b=>`<li>${b}</li>`).join("")}</ul></div>`;
    el.innerHTML = h;
    return;
  }
  if(state.mode==="vid"){
    let h = `<h2>${t.vidTitle}</h2><p class="note" style="margin-bottom:6px">${esc(t.vidMethod)}</p><div class="scroll">`;
    VIDENDAG.slice().sort((a,b)=>b.y-a.y).forEach(v=>{
      h += `<div class="item${state.sel==="v:"+v.id?" sel":""}" data-item="${v.id}"><h4 data-pickv="${v.id}">${markerSvg("v")}${esc(v.name)}</h4>
        <p class="note">${t.tt2025} ${v.x} % · ${t.tt2030} ${v.y} % · ${esc(t.q[quad(v)][0])}${v.note?" · "+esc(v.note):""}</p></div>`;
    });
    el.innerHTML = h + `</div>`;
    return;
  }
  renderOwnEditor(el);
}

function renderTable(el){
  const t = T_(), dark = isDark(), {k,dir} = state.sort;
  const rows = DATA.slice().sort((a,b)=>{
    if(k==="n") return dir*nameOf(a,state.lang).localeCompare(nameOf(b,state.lang), state.lang);

    return dir*(a[k]-b[k]);
  });
  const arrow = key => key===k ? (dir>0?" ↑":" ↓") : "";
  let h = `<h2>${t.tableTitle}</h2><div class="scroll"><table><thead><tr><th data-k="n">${t.cols[0]}${arrow("n")}</th><th class="num" data-k="x">${t.cols[1]}${arrow("x")}</th><th class="num" data-k="y">${t.cols[2]}${arrow("y")}</th><th data-k="q">${t.cols[3]}${arrow("q")}</th></tr></thead><tbody>`;

  });

}

    skills: state.own.map(({id,name,c,x,y,note})=>({id,name,category:c,x,y,note}))};

function importJSON(e){

    try{
      const data = JSON.parse(r.result); const list = Array.isArray(data) ? data : data.skills;
      if(!Array.isArray(list)) throw 0;
      const add = list.map(s=>({id:"o"+Math.random().toString(36).slice(2,9), name:String(s.name||"").slice(0,80), c:(CATS[s.category||s.c]?(s.category||s.c):"own"), x:clampN(s.x,0,80), y:clampN(s.y,0,100), note:String(s.note||"").slice(0,400)})).filter(validOwn);

  if(type==="o" && d.note) extra = `<div class="q">${esc(d.note)}</div>`;
  if(type==="w") extra = `<div class="q">${esc(t.q[quad(d)][0])}</div>`;
  if(type==="v" && d.note) extra = `<div class="q">${esc(d.note)}</div>`;
  const catLine = type==="v" ? `<div class="cat">${markerSvg("v")}${esc(t.tagVid)}</div>` : `<div class="cat"><span class="dot" style="background:${color(d.c,dark)}"></span>${esc(catOf(d.c)[state.lang])}</div>`;

  const cr = chart.getBoundingClientRect();

  if(top + thh > cr.height - 8) top = cr.height - thh - 8;

/* ---------- Hændelser i figuren ---------- */
const chartEl = document.getElementById("chart");
let drag = null, suppressClick = false;
function svgPoint(evt){ const svg = chartEl.querySelector("svg"); const p = svg.createSVGPoint(); p.x=evt.clientX; p.y=evt.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }

chartEl.addEventListener("mouseover", e=>{ if(drag) return; const g=e.target.closest(".pt"); if(g && !state.pinned) showTip(g.dataset.k); });
chartEl.addEventListener("mouseout", e=>{ const g=e.target.closest(".pt"); if(g && !g.contains(e.relatedTarget)) hideTip(); });

chartEl.addEventListener("pointerdown", e=>{
  const g = e.target.closest(".own"); if(!g || state.mode!=="own") return;
  const o = state.own.find(x=>"o:"+x.id===g.dataset.k); if(!o) return;
  const p = svgPoint(e);
  drag = {g, o, sx:p.x, sy:p.y, moved:false, id:e.pointerId};
  g.setPointerCapture(e.pointerId); g.classList.add("drag"); tip.classList.remove("show");
  e.preventDefault();
});
chartEl.addEventListener("pointermove", e=>{
  if(!drag) return;
  const p = svgPoint(e), dx = p.x-drag.sx, dy = p.y-drag.sy;
  if(Math.hypot(dx,dy) > 3) drag.moved = true;
  const nx = Math.max(X0, Math.min(X1, px(drag.o.x)+dx)) - px(drag.o.x);
  const ny = Math.max(Y0, Math.min(Y1, py(drag.o.y)+dy)) - py(drag.o.y);
  drag.g.setAttribute("transform", `translate(${nx} ${ny})`);
  drag.nx = drag.o.x + nx*XMAX/(X1-X0); drag.ny = drag.o.y - ny*YMAX/(Y1-Y0);
});
chartEl.addEventListener("pointerup", e=>{
  if(!drag) return;
  const d = drag; drag = null;
  if(d.moved){ d.o.x = clampN(d.nx,0,80); d.o.y = clampN(d.ny,0,100); state.sel = "o:"+d.o.id; persist(); suppressClick = true; renderOwnAll(); setTimeout(()=>suppressClick=false, 0); }
});

chartEl.addEventListener("click", e=>{

  if(state.mode==="own"){

  const top = sub ? 118 : 96, chartEnd = top + 715;
  let y = chartEnd + 22, leg = "";
  Object.entries(CATS).forEach(([k,c],i)=>{
    const col = i%4, row = Math.floor(i/4), x = 90 + col*220, yy = y + row*26;
    leg += `<circle cx="${x+6}" cy="${yy-4}" r="6.5" fill="${c.l}"/><text x="${x+20}" y="${yy}" font-size="13" fill="${th.ink}">${esc(c[state.lang])}</text>`;
  });
  y += 52;
  if(state.mode!=="wef"){
    const items = [["wd",t.mk.wefDim]];
    if(showDkeu()) items.push(["n",t.mk.nw],["m",t.mk.mv]);
    if(showVid()) items.push(["v",t.mk.vid]);
    if(state.mode==="own") items.push(["o",t.mk.own]);
    items.forEach(([k,lab],i)=>{
      const x = 90 + (i%4)*220 + 0, ink=th.muted; if(i===4){ y += 26; } 
      const m = k==="wd" ? `<circle cx="${x+6}" cy="${y-4}" r="4.5" fill="${ink}" opacity=".4"/>` :
                k==="n" ? `<path d="${diamond(x+6,y-4,7)}" fill="${ink}"/>` :
                k==="m" ? `<circle cx="${x+6}" cy="${y-4}" r="5.5" fill="#fff" stroke="${ink}" stroke-width="2.5"/>` :
                k==="v" ? `<path d="${hexagon(x+6,y-4,7.5)}" fill="#FFF387" stroke="#000" stroke-width="1.4"/>` :
                `<rect x="${x}" y="${y-10}" width="12" height="12" rx="3" fill="${ink}"/>`;
      leg += m + `<text x="${x+20}" y="${y}" font-size="13" fill="${th.ink}">${esc(lab)}</text>`;
    });
    y += 28;
  }
  y += 8;
  let foot = `<line x1="90" y1="${y}" x2="960" y2="${y}" stroke="${th.grid}"/>`;
  y += 26; foot += `<text x="90" y="${y}" font-size="12.5" fill="${th.ink}">${esc(t.exp1)}</text>`;
  y += 20; foot += `<text x="90" y="${y}" font-size="12.5" fill="${th.muted}">${esc(t.exp2)}</text>`;
  if(showDkeu()){ y += 20; foot += `<text x="90" y="${y}" font-size="12.5" fill="${th.muted}">${esc(t.exp3)}</text>`; }
  if(showVid()){ y += 20; foot += `<text x="90" y="${y}" font-size="12.5" fill="${th.muted}">${esc(t.exp4)}</text>`; }
  const H = y + 34;
  const pinnedBackup = state.pinned; state.pinned = null;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${font}">
    <rect width="${W}" height="${H}" fill="#FFFFFF"/>
    <rect x="90" y="24" width="10" height="10" fill="${th.hl}" stroke="#000" stroke-width="1"/><text x="108" y="34" font-size="12" font-weight="600" fill="${th.ink}" letter-spacing="1">${esc(t.eyebrow.toUpperCase())}</text>
    <rect x="84" y="50" width="${Math.min(890, 19.8*(t.titlePlain+t.titleSuffix[state.mode]).length+8)}" height="42" fill="${th.hl}"/><text x="90" y="82" font-size="34" font-weight="800" fill="${th.ink}">${esc(t.titlePlain+t.titleSuffix[state.mode])}</text>
    ${sub?`<text x="90" y="106" font-size="13.5" fill="${th.muted}">${esc(sub)}</text>`:""}
    <g transform="translate(0,${top})">${chartMarkup(th,false,state.lang)}</g>
    ${leg}${foot}
  </svg>`;
  state.pinned = pinnedBackup;
  const img = new Image();
  img.onload = ()=>{
    const scale = 2, cv = document.createElement("canvas");
    cv.width = W*scale; cv.height = H*scale;
    const ctx = cv.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
    cv.toBlob(b=>{
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b);
      const base = state.lang==="da" ? "kernekompetencer-2030" : "core-skills-2030";
      a.download = `${base}-${state.mode}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    }, "image/png");
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
};

renderAll();
</script>
</body>
</html>
